[package]
name = "ertracker-launcher"
version = "0.1.0"
description = "Installs ERtracker, keeps it on the latest release and starts it"
authors = ["ibiso"]
edition = "2024"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

[build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
