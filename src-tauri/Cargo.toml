[package]
name = "ertracker"
version = "0.1.0"
description = "Live Elden Ring progress tracker"
authors = ["ibiso"]
default-run = "ertracker"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ertracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
notify-debouncer-mini = "0.6"
aes = "0.8"
cbc = "0.1"
flate2 = "1"
zstd = "0.13"
libloading = "0.8"
num-bigint = "0.4"
base64 = "0.22"
texture2ddecoder = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep map extraction (texture decoding, RSA, decompression) fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
